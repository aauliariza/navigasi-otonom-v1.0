# Evaluasi seluruh konfigurasi deteksi objek (prompt bagian 9; proposal Sub-bab 3.2.5.1)
# split: val  -> mode proposal: alltest 5.050 (seleksi EWM-SAW sekaligus pelaporan)
#               mode internal: validasi internal (seleksi); split: test -> official test (evaluasi akhir)
data_yaml: datasets/sunrgbd_yolo/sunrgbd_detect.yaml
split: val
imgsz: 640
batch: 16
device: 0                 # 0 = GPU pertama; "cpu" untuk CPU
val_conf: 0.001           # ambang confidence untuk kurva PR / mAP (standar Ultralytics)
operating_point:          # P/R/F1 utama: deteksi yang dipakai saat inferensi (Sub-bab 3.2.4.1)
  conf: 0.25
  iou_nms: 0.45           # NMS IoU proposal; berlaku pada head one-to-many (end2end: false)
  end2end: false          # false = one-to-many + NMS (default Ultralytics .pt); true = one-to-one NMS-free (keputusan D-6)
  max_det: 100
  match_iou: 0.5          # TP/FP/FN pada IoU 0,5 (Sub-bab 3.2.5.1)
benchmark: {warmup: 50, iters: 300, half: false}
output_dir: outputs/evaluation/detection/{split}
# Alternatif EWM-SAW: DET-01 ... DET-10 (seluruh daftar eksperimen deteksi)
models:
  - {name: "DET-01 YOLO26x",                               config: configs/detection/teacher_x.yaml}
  - {name: "DET-02 YOLO26n",                               config: configs/detection/baseline.yaml}
  - {name: "DET-03 YOLO26n FeatureKD",                     config: configs/detection/feature_kd.yaml}
  - {name: "DET-04 YOLO26n PredictionKD",                  config: configs/detection/prediction_kd.yaml}
  - {name: "DET-05 YOLO26n Feature+PredictionKD",          config: configs/detection/feature_prediction_kd.yaml}
  - {name: "DET-06 YOLO26x+CA",                            config: configs/detection/teacher_x_ca.yaml}
  - {name: "DET-07 YOLO26n+CA",                            config: configs/detection/student_n_ca.yaml}
  - {name: "DET-08 YOLO26n FeatureKD (CA-teacher)",        config: configs/detection/ca_feature_kd.yaml}
  - {name: "DET-09 YOLO26n PredictionKD (CA-teacher)",     config: configs/detection/ca_prediction_kd.yaml}
  - {name: "DET-10 YOLO26n Feature+PredictionKD (CA-teacher)", config: configs/detection/ca_feature_prediction_kd.yaml}
extra_models: []
