_base_: _common.yaml
experiment:
  id: DET-06
  description: "DET-06: YOLO26x+CA -> YOLO26n, Feature KD + Prediction KD (L_total = L_det + L_feature + L_prediction)"
model:
  arch: yolo26n.yaml
  weights: yolo26n.pt
  attention: none
kd:
  enabled: true
  teacher_config: configs/detection/teacher_x_ca.yaml
  feature: {enabled: true, weight: 6.0}
  prediction:
    enabled: true
    weight: 1.0
    cls_weight: 1.0
    box_weight: 1.0
    temperature: 1.0
    branches: [one2many, one2one]
