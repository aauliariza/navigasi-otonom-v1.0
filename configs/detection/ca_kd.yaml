_base_: _common.yaml
experiment:
  id: DET-05
  description: >-
    DET-05: YOLO26x+CA (teacher) -> YOLO26n, Prediction KD sebagai konfigurasi KD dasar (prompt 5.1/5.6).
    Satu-satunya beda terhadap DET-04 adalah teacher ber-Coordinate Attention; beda terhadap DET-06 adalah
    tidak adanya Feature KD.
model:
  arch: yolo26n.yaml
  weights: yolo26n.pt
  attention: none           # student tetap YOLO26n standar
kd:
  enabled: true
  teacher_config: configs/detection/teacher_x_ca.yaml
  feature: {enabled: false}
  prediction:
    enabled: true
    weight: 1.0
    cls_weight: 1.0
    box_weight: 1.0
    temperature: 1.0
    branches: [one2many, one2one]
