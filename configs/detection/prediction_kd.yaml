_base_: _common.yaml
experiment:
  id: det_04_yolo26n_prediction_kd
  description: "Eksperimen 5.1-4: YOLO26x -> YOLO26n, Prediction KD (soft-label BCE kelas + L1 box berbobot confidence teacher)"
model:
  arch: yolo26n.yaml
  weights: yolo26n.pt
  attention: none
kd:
  enabled: true
  teacher_config: configs/detection/teacher_x.yaml
  feature: {enabled: false}
  prediction:
    enabled: true
    weight: 1.0
    cls_weight: 1.0
    box_weight: 1.0
    temperature: 1.0
    branches: [one2many, one2one]
