_base_: _common.yaml
experiment:
  id: TEACHER-CA
  description: "Teacher pendukung eksperimen 5.1-5/6: YOLO26x + Coordinate Attention pada P3/P4/P5 (layer 23-25), tanpa KD"
model:
  arch: yolo26x.yaml
  weights: yolo26x.pt       # layer 0-22 dan Detect head ditransfer; CoordAtt diinisialisasi acak
  attention: ca
  attention_args: {reduction: 32}
train:
  batch: 8
