_base_: _common.yaml
experiment:
  id: DET-05
  description: "DET-05: YOLO26x -> YOLO26n, Feature KD + Prediction KD"
model:
  arch: yolo26n.yaml
  weights: yolo26n.pt
  attention: none
kd:
  enabled: true
  teacher_config: configs/detection/teacher_x.yaml
  feature: {enabled: true, weight: 6.0}
  prediction:
    enabled: true
    weight: 1.0
    cls_weight: 1.0
    box_weight: 1.0
    temperature: 1.0
    branches: [one2many, one2one]
