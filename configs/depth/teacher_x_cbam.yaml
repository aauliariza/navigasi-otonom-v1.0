_base_: _common.yaml
experiment:
  id: TEACHER-CBAM
  description: "Teacher pendukung eksperimen 5.2-8/9: YOLO26x-Depth + CBAM pada P3/P4/P5 (layer 23-25), tanpa KD"
model:
  arch: yolo26x-depth.yaml
  weights: yolo26x-depth.pt
  attention: cbam
  attention_args: {reduction: 16, kernel_size: 7}
train:
  batch: 8
  lr0: 0.0005
