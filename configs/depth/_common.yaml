# Hyperparameter bersama seluruh eksperimen monocular depth estimation (proposal Tabel 3.8).
data:
  yaml: datasets/sunrgbd_yolo/sunrgbd_depth.yaml        # dihasilkan oleh src/data/prepare_sunrgbd.py
  integrity_report: outputs/dataset/integrity_report.json
  require_integrity: true

output:
  root: outputs
  group: depth

train:
  epochs: 100
  batch: 16
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: true
  patience: 25
  amp: true
  seed: 42
  deterministic: true
  workers: 8
  plots: true
  # Augmentasi (prompt 7.5). RGB dan depth ditransformasi sinkron oleh Ultralytics DepthDataset; depth tetap meter.
  # Zoom (scale), rotasi, shear, perspektif DIMATIKAN: memperbesar citra membuat objek tampak lebih dekat tanpa
  # mengubah nilai depth, sehingga skala metrik menjadi tidak konsisten (keputusan H-5). Mosaic/mixup/cutmix
  # tidak didukung DepthDataset (dipaksa 0 oleh Ultralytics).
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.5          # flip horizontal: geometri metrik tetap sah
  flipud: 0.0          # flip vertikal tidak realistis untuk indoor
  translate: 0.1       # pergeseran (isi 0 = invalid pada depth); tidak mengubah jarak
  scale: 0.0
  degrees: 0.0
  shear: 0.0
  perspective: 0.0

# Log-affine calibration D_metric = exp(a log D_pred + b) setelah training (Sub-bab 3.2.4.3)
calibration:
  enabled: true
  split: val          # (a, b) di-fit pada validasi internal (dari alltrain); test TIDAK pernah dipakai
  max_images: 1000

kd:
  enabled: false
