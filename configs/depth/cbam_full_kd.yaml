_base_: _common.yaml
experiment:
  id: dep_09_yolo26n_depth_cbam_full_kd
  description: "Eksperimen 5.2-9: YOLO26x-Depth+CBAM -> YOLO26n-Depth dengan Full Depth KD (4 komponen)"
model:
  arch: yolo26n-depth.yaml
  weights: yolo26n-depth.pt
  attention: none
kd:
  enabled: true
  teacher_config: configs/depth/teacher_x_cbam.yaml
  teacher_space: calibrated     # calibrated | raw
  output:   {enabled: true, weight: 0.5, beta: 0.1}
  feature:  {enabled: true, weight: 0.2, direction: teacher_to_student, normalize: true}   # layer 16/19/22
  boundary: {enabled: true, weight: 0.1, beta: 0.1, space: linear}
  relative: {enabled: true, weight: 0.1, num_pairs: 4096, tolerance: 0.03, margin: 0.0, equal_pair_loss: squared, seed: 42}
