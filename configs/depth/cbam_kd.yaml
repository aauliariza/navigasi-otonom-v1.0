_base_: _common.yaml
experiment:
  id: DEP-08
  description: "DEP-08: YOLO26x-Depth+CBAM -> YOLO26n-Depth dengan Depth Output Distillation (satu-satunya beda terhadap 5.2-3 adalah teacher ber-CBAM)"
model:
  arch: yolo26n-depth.yaml
  weights: yolo26n-depth.pt
  attention: none
kd:
  enabled: true
  teacher_config: configs/depth/teacher_x_cbam.yaml
  teacher_space: calibrated     # calibrated | raw
  output:   {enabled: true, weight: 0.5, beta: 0.1}
  feature:  {enabled: false, weight: 0.2, direction: teacher_to_student, normalize: true}   # layer 16/19/22
  boundary: {enabled: false, weight: 0.1, beta: 0.1, space: linear}
  relative: {enabled: false, weight: 0.1, num_pairs: 4096, tolerance: 0.03, margin: 0.0, equal_pair_loss: squared, seed: 42}
