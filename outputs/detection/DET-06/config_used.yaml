data:
  yaml: datasets/sunrgbd_yolo/sunrgbd_detect.yaml
  integrity_report: outputs/dataset/integrity_report.json
  require_integrity: true
output:
  root: outputs
  group: detection
train:
  epochs: 100
  batch: 8
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_bias_lr: 0.0
  cos_lr: true
  patience: 25
  amp: true
  seed: 42
  deterministic: true
  workers: 8
  plots: true
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.0
  translate: 0.1
  scale: 0.5
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  mosaic: 1.0
  mixup: 0.0
  close_mosaic: 10
kd:
  enabled: false
inference:
  conf: 0.25
  iou: 0.45
  max_det: 100
_source_: /home/comvis/Aulia/navigasi-otonom-v1.0/configs/detection/_common.yaml
experiment:
  id: DET-06
  description: 'DET-06: YOLO26x + Coordinate Attention (P3/P4/P5, layer 23-25), tanpa
    KD; teacher DET-08..10'
model:
  arch: yolo26x.yaml
  weights: yolo26x.pt
  attention: ca
  attention_args:
    reduction: 32
