[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navigasi-otonom"
version = "1.0.0"
description = "Analisis Knowledge Distillation pada YOLO26 untuk deteksi objek dan estimasi jarak objek dalam sistem navigasi otonom"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.4.194,<9.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scipy>=1.11.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["src*", "models*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: integration tests that build YOLO26 models (CPU, ~1-3 min)"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
